<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | {{BUSINESS_NAME}}</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="{{DOMAIN}}/404" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <meta name="theme-color" content="{{THEME_COLOR}}" />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <style>
      body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--brand-red-soft, #fff5f5); color:var(--ink, #111827); }
      .wrap { min-height:100vh; display:grid; place-items:center; padding:2rem; }
      .card { max-width:560px; background:#fff; border:1px solid #fecaca; border-radius:24px; padding:2rem; box-shadow:0 18px 42px rgba(17,24,39,0.12); }
      h1 { font-size:3rem; margin:0 0 1rem; }
      p { margin:0 0 1.5rem; }
      a { display:inline-flex; align-items:center; justify-content:center; min-height:52px; min-width:180px; border-radius:14px; background:linear-gradient(180deg,var(--brand-red,#d11c1c),var(--brand-red-dark,#a61212)); color:#fff; text-decoration:none; font-weight:800; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>404</h1>
        <p>The page you are looking for might have moved. Please return to the home page or call for immediate support.</p>
